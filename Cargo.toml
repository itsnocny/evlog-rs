[package]
name = "evlog"
version = "0.1.0"
edition = "2021"
description = "Structured logging with wide events for Rust. Accumulate context, emit once."
license = "MIT"
repository = "https://github.com/itsnocny/evlog-rust"
readme = "README.md"
keywords = ["logging", "structured", "wide-events", "observability"]
categories = ["development-tools::debugging"]

[features]
default = []
axum = ["dep:axum", "dep:tower-layer", "dep:tower-service"]
actix = ["dep:actix-web", "dep:actix-service", "dep:futures-util"]
rocket = ["dep:rocket"]
tracing = ["dep:tracing-subscriber", "dep:tracing-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
globset = "0.4"

axum = { version = "0.7", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

actix-web = { version = "4", optional = true }
actix-service = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }

rocket = { version = "0.5", optional = true }

tracing-subscriber = { version = "0.3", optional = true }
tracing-core = { version = "0.1", optional = true }

[[example]]
name = "axum_server"
required-features = ["axum", "tracing"]

[[example]]
name = "actix_server"
required-features = ["actix"]

[[example]]
name = "rocket_server"
required-features = ["rocket"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
